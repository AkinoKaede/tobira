[package]
name = "tobira"
version = "0.3.6"
edition = "2021"
authors = ["Kaede Akino <i@akinokae.de>"]
description = "A VMess relay written in Rust."
categories = ["network-programming"]
keywords = ["network", "proxy", "vmess", "v2ray", "tobira"]
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/AkinoKaede/tobira"

[[bin]]
name = "tobira"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tfo = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
h2 = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive", "rc"] }
toml = "1.1"
serde_json = "1"
base64 = "0.22"
url = "2"
bytes = "1"
crc32fast = "1"
md-5 = "0.11"
sha2 = "0.11"
aes = "0.9"
cipher = "0.5"
regex = "1"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip"] }
parking_lot = "0.12"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tokio-util = { version = "0.7", features = ["io"] }
notify = "8"
subtle = "2"
clap = { version = "4", features = ["derive"] }
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
